# Virtual workspace root — no installable package here.
# Run `uv sync` here to install all workspace members in a shared venv.
[tool.uv]
# Exclude labmaze — requires Bazel, not needed for dm_control.mjcf
# Pin toppra to 0.6.3 on non-x86_64 — 0.6.4+ stopped publishing an sdist and
# never shipped aarch64 wheels, so it can't be installed at all on this
# platform (e.g. Jetson) otherwise; 0.6.3 is the oldest version mj_manipulator
# accepts and still has an sdist uv can build from source.
override-dependencies = [
    "labmaze ; sys_platform == 'never'",
    "toppra==0.6.3 ; platform_machine == 'aarch64'",
]

[tool.uv.workspace]
members = [
    "asset_manager",
    "mj_environment",
    "mj_manipulator",
    "mj_manipulator_ros",
    "mj_viser",
    "prl_assets",
    "pycbirrt",
    "tsr",
    "openarm_assets",
    "openarm",
]

[tool.uv.sources]
ssik = { path = "../ssik", editable = true }
sstsr = { workspace = true }

[dependency-groups]
dev = [
    "catkin_pkg",
    "pin>=4.1.0",
    "robot-descriptions>=3.0.0",
    "ssik",
]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"
